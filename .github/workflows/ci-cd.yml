name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_REGISTRY: carrental.azurecr.io
  AKS_CLUSTER: carrental-aks
  AKS_RESOURCE_GROUP: carrental-rg

jobs:
  # ─── Test all services ────────────────────────────────────────────────────────
  test-backend:
    name: Test booking service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: go test ./... -race -coverprofile=coverage.out
      - run: go vet ./...

  test-auth:
    name: Test auth service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: go test ./... -race
      - run: go vet ./...

  test-payment:
    name: Test payment service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: go test ./... -race
      - run: go vet ./...

  test-gateway:
    name: Test API gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: go test ./... -race
      - run: go vet ./...

  test-frontend:
    name: Test & build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8080
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  # ─── Build & push Docker images ───────────────────────────────────────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [test-backend, test-auth, test-payment, test-gateway, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service:
          - name: booking-service
            context: ./backend
          - name: auth-service
            context: ./services/auth-service
          - name: payment-service
            context: ./services/payment-service
          - name: api-gateway
            context: ./services/api-gateway
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ matrix.service.name }}:latest
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ matrix.service.name }}:latest
          cache-to: type=inline

  # ─── Deploy to AKS ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Deploy all services (rolling update)
        run: |
          SHA=${{ github.sha }}

          # Update image tags in all deployments
          for SERVICE in booking-service auth-service payment-service api-gateway frontend; do
            kubectl set image deployment/${SERVICE} \
              ${SERVICE}=${{ env.ACR_REGISTRY }}/${SERVICE}:${SHA} \
              --record
          done

          # Wait for rollouts to complete
          for SERVICE in booking-service auth-service payment-service api-gateway frontend; do
            echo "Waiting for ${SERVICE}..."
            kubectl rollout status deployment/${SERVICE} --timeout=5m
          done

      - name: Verify deployments
        run: |
          kubectl get deployments
          kubectl get pods
          echo "✅ All services deployed successfully"
